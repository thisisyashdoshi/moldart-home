name: Marketing content remediation

on:
  push:
    branches:
      - marketing/mkt-009-live-content-safety-consolidation
    paths:
      - 'scripts/remediate_printed_decor_claims.py'
      - '.github/workflows/marketing-content-remediation.yml'

permissions:
  contents: write

jobs:
  remediate-known-printed-decor-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply narrow MKT-009 remediation
        run: python3 scripts/remediate_printed_decor_claims.py
      - name: Validate worktree
        run: git diff --check
      - name: Commit remediation when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No remediation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights public-site/insights images/insights public-site/images/insights
          git commit -m "MKT-009: remediate remaining printed decor claim patterns"
          git push origin HEAD:${{ github.ref_name }}
