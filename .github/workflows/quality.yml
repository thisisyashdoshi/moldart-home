name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Existing quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: JavaScript lint
        run: npm run lint:js

      - name: Unit tests
        run: npm run test:unit

      - name: Secret scan
        run: npm run secretlint:check

      - name: License check
        run: npm run license:check

      - name: Dependency audit
        run: npm run security:deps

      - name: CSS lint
        run: npm run lint:css

      - name: HTML lint
        run: npm run lint:html

      - name: Build
        run: npm run build

      - name: Release check
        run: npm run release:check

      - name: Unused code and dependency audit
        run: npm run unused:check
