        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#eff6ff"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="630" rx="36" fill="url(#posterGrad-industrial-press-plates-quality-priorities)"/>
    <rect x="38" y="38" width="1124" height="554" rx="30" fill="rgba(255,255,255,0.84)" stroke="rgba(24,24,27,0.06)"/>
    <rect x="60" y="64" width="220" height="36" rx="18" fill="#1d4ed8" opacity="0.92"/>
    <text x="84" y="88" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1.8">TOLERANCE-CRITICAL TOOLING</text>
    <text x="60" y="172" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">Industrial Press Plates:</text><text x="60" y="236" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">Flatness, Parallelism,</text><text x="60" y="300" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">and Incoming Inspection</text><text x="60" y="364" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">Priorities</text>
    <text x="60" y="446" font-family="Arial, sans-serif" font-size="24" fill="#52525b">Grade alone is not enough when the line is less forgiving.</text>
    <rect x="60" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="76" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">GRADE PLATFORM</text><text x="76" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">SUS 301 / 420 / 630</text><rect x="258" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="274" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">FLATNESS</text><text x="274" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Sub-0.05 mm/m</text><rect x="456" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="472" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">PARALLELISM</text><text x="472" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Approx. 0.02 mm</text>
    <rect x="720" y="96" width="396" height="438" rx="28" fill="#ffffff" stroke="rgba(24,24,27,0.06)"/>
    <text x="760" y="136" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" letter-spacing="1.6">DASHBOARD SNAPSHOT</text>
    <text x="760" y="152" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Application fit</text><rect x="760" y="170" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="170" width="189" height="14" rx="7" fill="#1d4ed8"/><text x="1000" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Start here</text><text x="760" y="210" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Check whether the route really fits the end use.</text><text x="760" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Specification clarity</text><rect x="760" y="288" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="288" width="155" height="14" rx="7" fill="#1d4ed8"/><text x="1000" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Important</text><text x="760" y="328" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Lock the terms before comparing price.</text><text x="760" y="388" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Approval discipline</text><rect x="760" y="406" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="406" width="189" height="14" rx="7" fill="#1d4ed8"/><text x="1000" y="418" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Important</text><text x="760" y="446" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Reference control reduces late-stage correction.</text>
    <circle cx="1094" cy="112" r="14" fill="#bfdbfe"/>
    <circle cx="1060" cy="112" r="8" fill="#1d4ed8"/>
