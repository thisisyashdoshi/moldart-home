<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HPL vs LPL (TFL/MFC): Which Surface Route Fits the Actual Brief?">
    <defs>
      <linearGradient id="posterGrad-hpl-vs-lpl-material-selection-guide" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f4f4f5"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="630" rx="36" fill="url(#posterGrad-hpl-vs-lpl-material-selection-guide)"/>
    <rect x="38" y="38" width="1124" height="554" rx="30" fill="rgba(255,255,255,0.84)" stroke="rgba(24,24,27,0.06)"/>
    <rect x="60" y="64" width="220" height="36" rx="18" fill="#18181b" opacity="0.92"/>
    <text x="84" y="88" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1.8">SPECIFICATION-LED COMPARISON</text>
    <text x="60" y="172" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">HPL vs LPL (TFL/MFC):</text><text x="60" y="236" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">Which Surface Route Fits</text><text x="60" y="300" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18181b">the Actual Brief?</text>
    <text x="60" y="446" font-family="Arial, sans-serif" font-size="24" fill="#52525b">Use condition should decide the laminate route, not habit.</text>
    <rect x="60" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="76" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">HPL PRESS ROUTE</text><text x="76" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Approx. 5–9 MPa</text><rect x="258" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="274" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">LPL PRESS ROUTE</text><text x="274" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Approx. 2–3 MPa</text><rect x="456" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="472" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">READ AS</text><text x="472" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Different systems</text>
    <rect x="720" y="96" width="396" height="438" rx="28" fill="#ffffff" stroke="rgba(24,24,27,0.06)"/>
    <text x="760" y="136" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" letter-spacing="1.6">DASHBOARD SNAPSHOT</text>
    <text x="760" y="152" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Abrasion / abuse tolerance</text><rect x="760" y="170" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="170" width="193" height="14" rx="7" fill="#18181b"/><text x="1000" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">HPL higher</text><text x="760" y="210" font-family="Arial, sans-serif" font-size="15" fill="#52525b">HPL normally sits in the stronger performance window.</text><text x="760" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Speed &amp; throughput</text><rect x="760" y="288" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="288" width="185" height="14" rx="7" fill="#18181b"/><text x="1000" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">LPL higher</text><text x="760" y="328" font-family="Arial, sans-serif" font-size="15" fill="#52525b">LPL wins on short-cycle board productivity and cost efficiency.</text><text x="760" y="388" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Moisture / heat resistance</text><rect x="760" y="406" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="406" width="176" height="14" rx="7" fill="#18181b"/><text x="1000" y="418" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">HPL higher</text><text x="760" y="446" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Particularly important in heavy-use horizontal or wet-area work.</text>
    <circle cx="1094" cy="112" r="14" fill="#d4d4d8"/>
    <circle cx="1060" cy="112" r="8" fill="#18181b"/>
  </svg>