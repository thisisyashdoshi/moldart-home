    <text x="60" y="446" font-family="Arial, sans-serif" font-size="24" fill="#52525b">The stack decides the surface before the complaint reaches QC.</text>
    <rect x="60" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="76" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">STEEL LOGIC</text><text x="76" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">400 / 600-series bias</text><rect x="258" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="274" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">CHROME WINDOW</text><text x="274" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Approx. 20–100 μm</text><rect x="456" y="486" width="176" height="60" rx="18" fill="rgba(255,255,255,0.92)" stroke="rgba(24,24,27,0.08)"/><text x="472" y="510" font-family="Arial, sans-serif" font-size="13" fill="#71717a" letter-spacing="1.2">PAD ROUTE</text><text x="472" y="537" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Silicone–copper</text>
