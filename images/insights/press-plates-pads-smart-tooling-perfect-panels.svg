    <text x="760" y="152" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Plate surface &amp; flatness</text><rect x="760" y="170" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="170" width="197" height="14" rx="7" fill="#18181b"/><text x="1000" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Primary</text><text x="760" y="210" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Finish drift often starts with the working surface itself.</text><text x="760" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Pad ageing / dead zones</text><rect x="760" y="288" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="288" width="185" height="14" rx="7" fill="#18181b"/><text x="1000" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Primary</text><text x="760" y="328" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Shows up as cloudy areas, pressure drift, and width-wise inconsistency.</text><text x="760" y="388" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">Chrome condition</text><rect x="760" y="406" width="220" height="14" rx="7" fill="#e4e4e7"/><rect x="760" y="406" width="172" height="14" rx="7" fill="#18181b"/><text x="1000" y="418" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">High</text><text x="760" y="446" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Wear, micro-cracking, or roughness drift can change release and gloss.</text>
