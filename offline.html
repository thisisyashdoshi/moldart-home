<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Moldart</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
        .wrap{max-width:28rem}
        .logo{font-weight:900;font-size:1.25rem;letter-spacing:0.15em;margin-bottom:3rem;opacity:0.5}
        h1{font-weight:900;font-size:clamp(1.5rem,5vw,2.25rem);line-height:1.2;margin-bottom:1rem}
        p{font-size:0.875rem;color:#a1a1aa;line-height:1.6;margin-bottom:2rem}
        button{background:#fff;color:#18181b;border:none;padding:0.75rem 2rem;font-size:0.875rem;font-weight:600;border-radius:8px;cursor:pointer;transition:opacity 0.15s}
        button:hover{opacity:0.85}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">MOLDART</div>
        <h1>YOU'RE OFFLINE</h1>
        <p>Please check your internet connection and try again. Our full product directory, catalogs, and contact information will be available once you're back online.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
