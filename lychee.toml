verbose = "warn"
format = "detailed"
no_progress = true
max_redirects = 5
max_retries = 1
max_concurrency = 6
timeout = 20
retry_wait_time = 2
accept = ["200..=299", "429"]
scheme = ["http", "https"]
require_https = false
exclude_all_private = true
include_mail = false
include_fragments = "full"
extensions = ["html", "md", "txt"]

exclude = [
  "^https?://localhost(:[0-9]+)?(/|$)",
  "^https?://127\\.0\\.0\\.1(:[0-9]+)?(/|$)",
  "^https?://0\\.0\\.0\\.0(:[0-9]+)?(/|$)",
  "^https?://10\\.",
  "^https?://172\\.(1[6-9]|2[0-9]|3[0-1])\\.",
  "^https?://192\\.168\\.",
  "^file:",
  "(?i)(api[-_ ]?key|secret|credential|token)"
]

exclude_path = [
  "(^|/)\\.git/",
  "(^|/)\\.tmp/",
  "(^|/)node_modules/",
  "(^|/)public-site/",
  "(^|/)pagefind/",
  "(^|/)trade-portal/",
  "(^|/)\\.env(\\.|$)",
  "(?i)(api[-_ ]?keys|secret|credential|private[-_ ]?key)"
]
