      <polygon points="0,283 344,251 344,346 0,378" fill="#D3C7B0"/>
      <polygon points="0,378 344,346 344,364 0,396" fill="#A99A82"/>
      <line x1="404" y1="20" x2="404" y2="378" stroke="#84573C" stroke-width="4"/>
      <polygon points="404,20 393,40 415,40" fill="#84573C"/>
      <polygon points="404,378 393,358 415,358" fill="#84573C"/>
    </g>
    <text x="58" y="642" font-size="15" fill="#68645E">Technical discussion visual · requirement-led · exact product construction not implied</text>
